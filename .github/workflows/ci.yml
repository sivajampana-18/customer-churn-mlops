name: Customer Churn MLOps CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m src.data.generate_data
      - run: python -m src.train
      - run: pytest -q
